# Configuración para Render (también se puede crear el servicio a mano:
# New → Web Service → este repositorio → Build: npm install → Start: npm start)
services:
  - type: web
    name: studyflow
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
